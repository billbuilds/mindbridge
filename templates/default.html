<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<style>
  /* ── Reset ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── Palette ── */
  :root {
    --bg: #FFFFFF;
    --text: #111111;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --surface: #F9FAFB;
  }

  /* ── Base ── */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    padding: 48px 24px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ── Typography ── */
  h1 { font-size: 2em; font-weight: 700; margin-bottom: 0.5em; }
  h2 { font-size: 1.5em; font-weight: 600; margin-top: 3em; margin-bottom: 0.75em; }
  h3 { font-size: 1.15em; font-weight: 600; margin-top: 2em; margin-bottom: 0.5em; }
  p { margin-bottom: 1.25em; }

  .subtitle {
    color: var(--text-secondary);
    font-size: 1.05em;
    margin-bottom: 2em;
  }

  /* ── Summary block ── */
  .summary {
    border-left: 3px solid var(--accent);
    background: var(--accent-bg);
    padding: 16px 20px;
    margin-bottom: 2.5em;
    border-radius: 0 6px 6px 0;
  }

  /* ── Callout ── */
  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-bg);
    padding: 16px 20px;
    margin: 1.5em 0;
    border-radius: 0 6px 6px 0;
  }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; margin: 1.5em 0; }
  th {
    text-align: left;
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Code ── */
  code {
    font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    font-size: 0.9em;
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
  }
  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    margin: 1.5em 0;
  }
  pre code { background: none; padding: 0; }

  /* ── Collapsible ── */
  details { border-bottom: 1px solid var(--border); margin: 1em 0; }
  summary {
    padding: 12px 0;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  details[open] summary { margin-bottom: 8px; }
  details .detail-content { padding: 0 0 16px; }

  /* ── Takeaway ── */
  .takeaway {
    border-top: 2px solid var(--accent);
    padding-top: 1.5em;
    margin-top: 3em;
    font-size: 1.1em;
  }

  /* ── Diagram ── */
  .mermaid {
    margin: 1.5em 0;
    text-align: center;
  }

  /* ── Links ── */
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Lists ── */
  ul, ol { margin: 0.75em 0 1.25em 1.5em; }
  li { margin-bottom: 0.4em; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    body { padding: 24px 16px; }
    h1 { font-size: 1.6em; }
  }
</style>
</head>
<body>
<div class="container">

<!--
  MindBridge CSS Reference Template
  
  AI: Read this file for CSS variables, component styles, and
  layout rules. Then write your own complete HTML using these
  styles. Do NOT try to fill in placeholders — write the full
  page from scratch.
  
  Key classes:
  - .container    — max-width wrapper
  - .subtitle     — secondary text under h1
  - .summary      — blue-bordered intro block
  - .callout      — blue-bordered info box
  - .takeaway     — top-bordered closing section
  - .detail-content — content inside <details>
  - .mermaid      — Mermaid diagram container
-->

  <!-- Layer 0: Title -->
  <h1>Page title here</h1>
  <p class="subtitle">One-line subtitle</p>

  <!-- Layer 1: Summary -->
  <div class="summary">
    2-3 sentence summary with analogy
  </div>

  <!-- Layer 2: Sections (mix h2, tables, code, diagrams, etc.) -->

  <!-- Layer 3: Collapsible details for optional depth -->
  <details>
    <summary>Click to expand</summary>
    <div class="detail-content">Deep detail here</div>
  </details>

  <!-- Takeaway -->
  <div class="takeaway">
    1-2 memorable sentences
  </div>

</div>
<script>
  mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
  hljs.highlightAll();
</script>
</body>
</html>
